<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scrcpy Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-0: #080b14;
  --bg-1: #0f1526;
  --bg-2: #151e33;
  --card: rgba(17, 25, 44, 0.92);
  --line: rgba(120, 148, 215, 0.25);
  --text: #ecf0ff;
  --text-dim: #9aa8cc;
  --accent: #7b8cff;
  --accent-2: #36d5ff;
  --grid-dot: rgba(120, 148, 215, 0.22);
}
html, body { height: 100%; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* ---- n8n-style dotted grid canvas ---- */
#canvas {
  position: fixed;
  inset: 0;
  background-color: var(--bg-0);
  background-image:
    radial-gradient(900px 500px at 0% 0%, rgba(54, 213, 255, 0.10), transparent 55%),
    radial-gradient(900px 500px at 100% 100%, rgba(123, 140, 255, 0.10), transparent 55%),
    radial-gradient(circle, var(--grid-dot) 1.4px, transparent 1.6px);
  background-size: auto, auto, 22px 22px;
  overflow: hidden;
  touch-action: none;
}

/* ---- Empty state (no devices connected) ---- */
#empty-state {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 8px; text-align: center; pointer-events: none; user-select: none;
}
#empty-state .es-title { font-size: 17px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.02em; }
#empty-state .es-sub { font-size: 12px; color: rgba(154, 168, 204, 0.6); }

/* Bottom-right floating stack: agent chat opener above the phone/redroid view
   toggle. Both use the dark-card look; the toggle's state shows in its accent
   color (red = phones shown, tap for redroid; green = redroid shown, tap for phones). */
#agent-toggle {
  position: fixed; right: 22px; bottom: 22px; z-index: 9999;
  width: 46px; height: 46px; border-radius: 50%; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  transition: border-color 0.2s ease, color 0.2s ease, transform 0.1s ease;
}
#agent-toggle svg { width: 24px; height: 24px; display: block; }
#agent-toggle.to-redroid { color: #e5484d; border-color: rgba(229, 72, 77, 0.55); }
#agent-toggle.to-phones  { color: #30a46c; border-color: rgba(48, 164, 108, 0.55); }
#agent-toggle.to-redroid:hover { border-color: #e5484d; }
#agent-toggle.to-phones:hover  { border-color: #30a46c; }
#agent-toggle:active { transform: scale(0.93); }

/* Agent chat panel opener — stacked above the view toggle */
#agent-panel-toggle {
  position: fixed; right: 22px; bottom: 80px; z-index: 9999;
  width: 46px; height: 46px; border-radius: 50%; border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text);
  background: var(--card); border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  transition: border-color 0.2s ease, transform 0.1s ease;
}
#agent-panel-toggle svg { width: 24px; height: 24px; }
#agent-panel-toggle:hover { border-color: rgba(123, 140, 255, 0.65); }
#agent-panel-toggle:active { transform: scale(0.93); }
body.agent-open #agent-panel-toggle { display: none; }

/* ---- Floating phone card ---- */
.phone-card {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(10px);
  user-select: none;
}
.phone-card.active { border-color: rgba(54, 213, 255, 0.7); box-shadow: 0 18px 55px rgba(0,0,0,0.55), 0 0 0 2px rgba(54,213,255,0.35); }

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  cursor: move;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, rgba(22, 30, 54, 0.95), rgba(18, 27, 49, 0.95));
  border-radius: 14px 14px 0 0;
  touch-action: none;
}
.grip { flex-shrink: 0; color: var(--text-dim); letter-spacing: 2px; font-size: 12px; line-height: 1; }
.card-label { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text); }
.card-status {
  flex: 1; font-size: 11px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-align: right; letter-spacing: 0.02em;
}

.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 19;
  background: radial-gradient(circle at 50% 10%, #0f1628 10%, #02040a 80%);
  overflow: hidden;
}
.remote-video { width: 100%; height: 100%; object-fit: contain; display: block; }
.touch-overlay { position: absolute; inset: 0; cursor: default; touch-action: none; }
.video-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(0, 0, 0, 0.6); color: var(--text-dim); font-size: 13px;
  z-index: 10; pointer-events: none;
}
.video-loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(123, 140, 255, 0.2);
  border-top: 3px solid var(--accent-2);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.btn-bar {
  display: flex; gap: 6px; padding: 9px;
  background: linear-gradient(180deg, rgba(20, 29, 51, 0.95), rgba(14, 21, 38, 0.95));
  border-top: 1px solid var(--line);
  border-radius: 0 0 14px 14px;
  flex-wrap: wrap; justify-content: center;
}
.btn-bar button {
  padding: 7px 11px; font-size: 12px;
  background: linear-gradient(180deg, rgba(123, 140, 255, 0.22), rgba(90, 105, 214, 0.18));
  color: var(--text); border: 1px solid rgba(123, 140, 255, 0.35);
  border-radius: 10px; cursor: pointer; font-weight: 600;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.btn-bar button:hover { border-color: rgba(123, 140, 255, 0.65); box-shadow: 0 0 0 2px rgba(123, 140, 255, 0.18); transform: translateY(-1px); }
.btn-bar button:active { transform: translateY(0); }
.btn-bar button.kb-on { background: var(--accent); color: #fff; }

/* ---- Resize handle (bottom-right corner) ---- */
.resize-handle {
  position: absolute; right: -3px; bottom: -3px;
  width: 20px; height: 20px; cursor: nwse-resize; z-index: 20; touch-action: none;
}
.resize-handle::after {
  content: ''; position: absolute; right: 4px; bottom: 4px;
  width: 11px; height: 11px;
  border-right: 2px solid var(--accent-2); border-bottom: 2px solid var(--accent-2);
  border-radius: 0 0 4px 0; opacity: 0.85;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(123, 140, 255, 0.65), rgba(54, 213, 255, 0.55)); border-radius: 999px; }

/* ---- Agent side panel (left) ---- */
#agent-panel {
  position: fixed; left: 0; top: 0; bottom: 0;
  width: 340px; z-index: 500;
  display: flex; flex-direction: column;
  background: var(--card);
  border-right: 1px solid var(--line);
  box-shadow: 8px 0 30px rgba(0, 0, 0, 0.4);
  backdrop-filter: blur(10px);
  transform: translateX(-100%);
  transition: transform 0.25s ease;
}
#agent-panel.open { transform: translateX(0); }

.agent-head {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, rgba(22, 30, 54, 0.95), rgba(18, 27, 49, 0.95));
  flex-shrink: 0;
}
.agent-head .ah-title { font-size: 13px; font-weight: 700; flex: 1; }
.agent-head .ah-status { font-size: 10px; color: var(--text-dim); }
.agent-head button {
  padding: 5px 9px; font-size: 11px; font-weight: 600;
  background: linear-gradient(180deg, rgba(123, 140, 255, 0.22), rgba(90, 105, 214, 0.18));
  color: var(--text); border: 1px solid rgba(123, 140, 255, 0.35);
  border-radius: 8px; cursor: pointer;
}
.agent-head button:hover { border-color: rgba(123, 140, 255, 0.65); }
#agent-rec-btn, #agent-reset-btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 4px 6px;   /* 아이콘 버튼 — 텍스트 패딩보다 정사각형에 가깝게 */
}
#agent-rec-btn svg, #agent-reset-btn svg { display: block; }
#agent-auto-btn.on {
  color: #fff; background: #30a46c; border-color: #30a46c;
  animation: recpulse2 1.6s ease-in-out infinite;
}
@keyframes recpulse2 {
  0%, 100% { box-shadow: 0 0 0 0 rgba(48, 164, 108, 0.5); }
  50% { box-shadow: 0 0 0 6px rgba(48, 164, 108, 0); }
}
#agent-rec-btn { color: #ff9b9b; }
#agent-rec-btn.recording {
  color: #fff; background: #e5484d; border-color: #e5484d;
  animation: recpulse 1.6s ease-in-out infinite;
}
@keyframes recpulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(229, 72, 77, 0.5); }
  50% { box-shadow: 0 0 0 6px rgba(229, 72, 77, 0); }
}

#agent-appbar {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  padding: 8px 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(14, 20, 38, 0.85);
  flex-shrink: 0;
  font-size: 11px; color: var(--text-dim);
}
#agent-appbar .ab-icon {
  width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
  object-fit: cover; background: rgba(123, 140, 255, 0.15);
}
#agent-appbar .ab-app {
  font-weight: 700; color: var(--text);
  max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#agent-appbar .ab-book {
  padding: 3px 8px; font-size: 10.5px; font-weight: 600;
  background: rgba(123, 140, 255, 0.18); color: var(--text);
  border: 1px solid rgba(123, 140, 255, 0.4); border-radius: 7px;
  cursor: pointer;
}
#agent-appbar .ab-book:hover { border-color: rgba(123, 140, 255, 0.7); }
#agent-appbar .ab-book.none { cursor: default; opacity: 0.55; }
#agent-appbar .ab-book.none:hover { border-color: rgba(123, 140, 255, 0.4); }

#agent-log {
  flex: 1; overflow-y: auto; padding: 10px;
  display: flex; flex-direction: column; gap: 8px;
}
.agent-msg { max-width: 92%; padding: 7px 10px; border-radius: 10px; font-size: 12px; line-height: 1.5; word-break: break-word; }
.agent-msg.user { align-self: flex-end; background: rgba(123, 140, 255, 0.25); border: 1px solid rgba(123, 140, 255, 0.4); }
.agent-msg.bot  { align-self: flex-start; background: rgba(21, 30, 51, 0.9); border: 1px solid var(--line); }
.agent-msg.bot p { margin: 0 0 6px 0; } .agent-msg.bot p:last-child { margin-bottom: 0; }
.agent-msg.bot h1,.agent-msg.bot h2,.agent-msg.bot h3 { font-size: 13px; margin: 8px 0 4px 0; color: #aebcff; }
.agent-msg.bot ul,.agent-msg.bot ol { margin: 4px 0; padding-left: 18px; }
.agent-msg.bot li { margin: 2px 0; }
.agent-msg.bot code { font-family: ui-monospace, monospace; font-size: 11px; background: rgba(10, 15, 30, 0.9); border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
.agent-msg.bot pre { background: rgba(10, 15, 30, 0.9); border: 1px solid var(--line); border-radius: 8px; padding: 8px; overflow-x: auto; margin: 6px 0; }
.agent-msg.bot pre code { border: none; padding: 0; background: none; }
.agent-msg.bot a { color: #8fa4ff; }
.agent-msg.bot strong { color: #dfe4ff; }
.agent-msg.bot table { border-collapse: collapse; margin: 6px 0; font-size: 11px; }
.agent-msg.bot th,.agent-msg.bot td { border: 1px solid var(--line); padding: 3px 7px; }
.agent-msg.tool { align-self: flex-start; font-size: 10.5px; color: var(--text-dim); background: rgba(21, 30, 51, 0.55); border: 1px dashed rgba(120, 148, 215, 0.3); }
.agent-msg.tool b { color: #9db1f2; font-weight: 700; }
.agent-msg.err  { align-self: flex-start; color: #ff9b9b; background: rgba(229, 72, 77, 0.12); border: 1px solid rgba(229, 72, 77, 0.4); }
.agent-msg.summary { align-self: stretch; max-width: 100%; font-size: 11px;
  background: rgba(48, 164, 108, 0.07); border: 1px solid rgba(126, 226, 168, 0.25);
  border-radius: 10px; padding: 7px 10px; }
.agent-msg.summary .sum-label { font-size: 10px; font-weight: 700; color: #7ee2a8;
  margin-bottom: 4px; letter-spacing: 0.02em; }
.agent-msg.summary .sum-body p { margin: 0 0 4px 0; }
.agent-msg.summary .sum-body p:last-child { margin-bottom: 0; }
.agent-msg.summary .sum-body ul, .agent-msg.summary .sum-body ol { margin: 2px 0; padding-left: 16px; }
.agent-msg.summary .sum-body li { margin: 1px 0; }
.agent-msg.summary .sum-body strong { color: #dfe4ff; }
.agent-msg.summary .sum-body h1, .agent-msg.summary .sum-body h2,
.agent-msg.summary .sum-body h3 { font-size: 11.5px; margin: 6px 0 3px 0; color: #aebcff; }

#agent-inputbar {
  display: flex; gap: 6px; padding: 9px;
  border-top: 1px solid var(--line); flex-shrink: 0;
}
#agent-input {
  flex: 1; padding: 8px 10px; font-size: 12px;
  background: rgba(10, 15, 30, 0.8); color: var(--text);
  border: 1px solid var(--line); border-radius: 10px; outline: none;
}
#agent-input:focus { border-color: rgba(123, 140, 255, 0.6); }
#agent-send {
  padding: 8px 13px; font-size: 12px; font-weight: 700;
  background: var(--accent); color: #fff; border: none;
  border-radius: 10px; cursor: pointer;
}
#agent-send:disabled { opacity: 0.4; cursor: default; }

/* Skill viewer overlay inside panel */
#agent-skillview {
  position: absolute; inset: 0; z-index: 10;
  background: var(--bg-1); display: none; flex-direction: column;
}
#agent-skillview.open { display: flex; }
#agent-skillview .sv-head {
  display: flex; align-items: center; gap: 8px; padding: 10px 12px;
  border-bottom: 1px solid var(--line); flex-shrink: 0;
}
#agent-skillview .sv-title { flex: 1; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#agent-skillview .sv-body { flex: 1; overflow-y: auto; padding: 12px; font-size: 11.5px; white-space: pre-wrap; color: var(--text); line-height: 1.6; }
#agent-skillview .sv-list { display: flex; flex-direction: column; gap: 6px; }
#agent-skillview .sv-item {
  padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px;
  cursor: pointer; background: rgba(21, 30, 51, 0.8);
}
#agent-skillview .sv-item:hover { border-color: rgba(123, 140, 255, 0.6); }
#agent-skillview .sv-item .si-name { font-size: 11.5px; font-weight: 600; word-break: break-all; }
#agent-skillview .sv-item .si-meta { font-size: 10px; color: var(--text-dim); margin-top: 3px; }

#ime-sink { position: fixed; left: -200px; top: 0; width: 100px; height: 20px; opacity: 0; }
</style>
</head>
<body>

<div id="canvas">
  <div id="empty-state">
    <div class="es-title">연결된 기기가 없습니다</div>
    <div class="es-sub">기기를 연결하면 화면이 자동으로 나타납니다</div>
  </div>
</div>

<button id="agent-toggle" class="to-redroid" type="button" title="Redroid(에이전트) 화면 보기" aria-label="에이전트 화면 전환">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M12 6.5V3.2"/><circle cx="12" cy="2.4" r="1.1" fill="currentColor" stroke="none"/>
    <rect x="4" y="6.5" width="16" height="12.5" rx="3.5"/>
    <path d="M4 12H2.2"/><path d="M20 12h1.8"/>
    <circle cx="9" cy="12.5" r="1.35" fill="currentColor" stroke="none"/>
    <circle cx="15" cy="12.5" r="1.35" fill="currentColor" stroke="none"/>
    <path d="M9.5 16h5"/>
  </svg>
</button>

<!-- ---- Agent chat side panel (left) ---- -->
<button id="agent-panel-toggle" type="button" title="에이전트 채팅" aria-label="에이전트 채팅 패널 열기">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
    <path d="M8 12h.01"/>
    <path d="M12 12h.01"/>
    <path d="M16 12h.01"/>
  </svg>
</button>

<div id="agent-panel">
  <div class="agent-head">
    <span class="ah-title">게임 에이전트</span>
    <span class="ah-status" id="agent-status">대기</span>
    <button id="agent-stop-btn" type="button" title="진행 중단" hidden>■</button>
    <button id="agent-auto-btn" type="button" title="자동 진행: 턴이 끝나도 서버가 이어서 진행 (게임 사이클 완료 시 자동 정지)">▶ 자동</button>
    <button id="agent-rec-btn" type="button" title="녹화: 종료 시 자동 분석해 게임북에 추가" aria-label="녹화 시작/중지">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="currentColor"/></svg>
</button>
    <button id="agent-reset-btn" type="button" title="새 세션" aria-label="새 세션 시작">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12a9 9 0 1 1-2.64-6.36"/>
    <path d="M21 3v6h-6"/>
  </svg>
</button>
    <button id="agent-close-btn" type="button" title="닫기">✕</button>
  </div>
  <div id="agent-appbar">
    <img class="ab-icon" id="agent-appicon" alt="" hidden>
    <span>현재 앱:</span>
    <span class="ab-app" id="agent-appname">확인 중…</span>
    <button class="ab-book none" id="agent-book-btn" type="button">게임북 0</button>
  </div>
  <div id="agent-log"></div>
  <div id="agent-inputbar">
    <input id="agent-input" type="text" placeholder="에이전트에게 지시…" autocomplete="off">
    <button id="agent-send" type="button">전송</button>
  </div>
  <div id="agent-skillview">
    <div class="sv-head">
      <span class="sv-title" id="sv-title">저장된 스킬</span>
      <button id="sv-close" type="button">✕</button>
    </div>
    <div class="sv-body" id="sv-body"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jmuxer@2.1.0/dist/jmuxer.min.js"></script>
<script>
/* =================================================================
   scrcpy Web Remote — multi-device dashboard
   Each device = one floating PhoneCard. Video/control go to the C
   backend via Apache (/ws/* -> 18080, /ws2/* -> 18081).
   ================================================================= */

const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
function wsUrl(path) { return `${wsProto}//${window.location.host}${path}`; }

// One entry per device. Add more here + a matching scrcpy-webN service & Apache route.
const DEVICES = [
  { label: 'Z-Flip4', video: '/ws/video',  control: '/ws/control',  kind: 'phone'   },
  { label: 'Velvet',  video: '/ws4/video', control: '/ws4/control', kind: 'phone'   },
  { label: 'Redroid-Kakao', video: '/ws3/video', control: '/ws3/control', kind: 'redroid' },
  { label: 'Redroid-iSharing', video: '/ws2/video', control: '/ws2/control', kind: 'redroid' },
];

// Browser KeyboardEvent.code -> USB HID keyboard usage (= scrcpy scancode), for
// devices whose backend runs scrcpy's UHID keyboard (-K): the device then sees a
// physical keyboard and its own IME composes non-ASCII text (e.g. Hangul).
const HID_USAGE = {
  'KeyA':0x04,'KeyB':0x05,'KeyC':0x06,'KeyD':0x07,'KeyE':0x08,'KeyF':0x09,'KeyG':0x0A,
  'KeyH':0x0B,'KeyI':0x0C,'KeyJ':0x0D,'KeyK':0x0E,'KeyL':0x0F,'KeyM':0x10,'KeyN':0x11,
  'KeyO':0x12,'KeyP':0x13,'KeyQ':0x14,'KeyR':0x15,'KeyS':0x16,'KeyT':0x17,'KeyU':0x18,
  'KeyV':0x19,'KeyW':0x1A,'KeyX':0x1B,'KeyY':0x1C,'KeyZ':0x1D,'Digit1':0x1E,'Digit2':0x1F,
  'Digit3':0x20,'Digit4':0x21,'Digit5':0x22,'Digit6':0x23,'Digit7':0x24,'Digit8':0x25,'Digit9':0x26,
  'Digit0':0x27,'Enter':0x28,'Escape':0x29,'Backspace':0x2A,'Tab':0x2B,'Space':0x2C,'Minus':0x2D,
  'Equal':0x2E,'BracketLeft':0x2F,'BracketRight':0x30,'Backslash':0x31,'Semicolon':0x33,'Quote':0x34,'Backquote':0x35,
  'Comma':0x36,'Period':0x37,'Slash':0x38,'CapsLock':0x39,'F1':0x3A,'F2':0x3B,'F3':0x3C,

      const opts = {
        node: video, mode: 'video', flushingTime: 100, fps: 30, debug: false,
        onReady: () => { setStatus('Ready [' + codec.toUpperCase() + ']'); self.jmuxerRetry = 0; },
        onError: (err) => {
          const name = err && (err.name || ''); const msg = err && (err.error || err.message || '');
          setStatus('Video error');
          if (name === 'InvalidStateError' || msg === 'buffer error') {
            self.jmuxerRetry++;
            if (self.jmuxerRetry <= 3) { setStatus('Reinitializing...'); setTimeout(() => initJmuxer(self.deviceCodec || 'h264'), 1000); }
            else { self.jmuxerRetry = 0; setStatus('Reconnecting...'); if (self.videoWs) self.videoWs.close(); }
          }
        },
      };
      if (jVideoCodec) opts.videoCodec = jVideoCodec;
      self.jmuxer = new JMuxer(opts);
    } catch (e) { setStatus('jmuxer init error'); }
  }

  /* ---- drag (header) ---- */
  (function () {
    let dragging = false, offX = 0, offY = 0;
    header.addEventListener('pointerdown', (e) => {
      dragging = true; self.userSized = true; bringToFront(self);
      const r = root.getBoundingClientRect(); offX = e.clientX - r.left; offY = e.clientY - r.top;
      header.setPointerCapture(e.pointerId); e.preventDefault();
    });
    header.addEventListener('pointermove', (e) => { if (dragging) self.setPos(e.clientX - offX, e.clientY - offY); });
    const end = (e) => { if (!dragging) return; dragging = false; try { header.releasePointerCapture(e.pointerId); } catch (_) {} };
    header.addEventListener('pointerup', end);
    header.addEventListener('pointercancel', end);
  })();

  /* ---- resize (corner) ---- */
  (function () {
    let resizing = false, startX = 0, startW = 0;
    handle.addEventListener('pointerdown', (e) => {
      resizing = true; self.userSized = true; bringToFront(self);
      startX = e.clientX; startW = root.offsetWidth;
      handle.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
    });
    handle.addEventListener('pointermove', (e) => { if (resizing) self.setWidth(startW + (e.clientX - startX)); });
    const end = (e) => { if (!resizing) return; resizing = false; try { handle.releasePointerCapture(e.pointerId); } catch (_) {} };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  })();

  /* ---- touch overlay ---- */
  (function () {
    let isDown = false;
    overlay.addEventListener('contextmenu', (e) => e.preventDefault());
    overlay.addEventListener('mousedown', (e) => {
      e.preventDefault(); bringToFront(self);
      if (e.button === 2) { self.sendKey('back'); return; }
      isDown = true; self.sendTouch('down', e.clientX, e.clientY);
    });
    overlay.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); self.sendTouch('move', e.clientX, e.clientY); });
    overlay.addEventListener('mouseup', (e) => { if (!isDown) return; isDown = false; e.preventDefault(); self.sendTouch('up', e.clientX, e.clientY); });
    overlay.addEventListener('mouseleave', (e) => { if (!isDown) return; isDown = false; self.sendTouch('up', e.clientX, e.clientY); });
    overlay.addEventListener('touchstart', (e) => { e.preventDefault(); bringToFront(self); const t = e.touches[0]; isDown = true; self.sendTouch('down', t.clientX, t.clientY); });
    overlay.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; self.sendTouch('move', t.clientX, t.clientY); });
    overlay.addEventListener('touchend', (e) => { e.preventDefault(); isDown = false; const t = e.changedTouches[0]; self.sendTouch('up', t.clientX, t.clientY); });
    overlay.addEventListener('touchcancel', (e) => { e.preventDefault(); isDown = false; const t = e.changedTouches[0]; self.sendTouch('up', t.clientX, t.clientY); });
  })();

  /* ---- boot ---- */
  // Hide the "Loading…" overlay as soon as the first frame is renderable.
  // A static/dozing screen sends only one cached keyframe (no timeupdate ticks),
  // so trigger on loadeddata/canplay and the first buffered data too — otherwise the
  // card stays stuck on "Loading…" until the user nudges the device (e.g. Home).
  function markVideoStarted() {
    if (self.videoStarted) return;
    self.videoStarted = true;
    loading.style.display = 'none';
    updateOrientation();
    if (!self.userSized) { self.fitToViewport(); layoutCards(); }
  }
  video.addEventListener('timeupdate', () => { if (video.currentTime > 0) markVideoStarted(); });
  video.addEventListener('loadeddata', markVideoStarted);
  video.addEventListener('canplay', markVideoStarted);
  video.addEventListener('resize', () => {
    updateOrientation();
    if (!self.userSized) { self.fitToViewport(); layoutCards(); }
  });

  // initial width before first frame
  self.setWidth(Math.min(320, Math.round(window.innerWidth * 0.42), maxCardWidth()));
  initVideoWs();
  initControlWs();
  resizeOverlay();
  return self;
}

async function agentLoadHistory() {

    for (const m of (data.messages || [])) {

/* ---- 에이전트 상태: 서버 실제 상태(세션 락) 폴링 — 새로고침해도 진행 중 표시 유지 ----
   진행 중이면 세션 파일을 다시 당겨(증분) ⚙ 로그를 이어서 표시한다. */
let serverBusy = false;
let statusTimer = null;
let histLen = 0;

async function agentPollStatus() {
  try {
    const r = await fetch('/agent/status');
    const d = await r.json();
    serverBusy = !!d.busy;
    // 자동 진행 상태 동기화 (새로고침 후에도 버튼에 반영)
    if (autoBtn && typeof d.auto !== 'undefined' && d.auto !== autoOn) {
      autoOn = d.auto;
      autoBtn.classList.toggle('on', autoOn);
      autoBtn.textContent = autoOn ? '⏹ 자동' : '▶ 자동';
    }
  } catch { serverBusy = false; }
  renderAgentStatus();
  if (serverBusy) await agentPullNewHistory();
}

async function agentPullNewHistory() {
  try {
    const r = await fetch('/agent/history');
    const d = await r.json();
    const msgs = d.messages || [];
    if (msgs.length > histLen) {
      for (const m of msgs.slice(histLen)) {
        const cls = { user: 'user', bot: 'bot', tool: 'tool', error: 'err',
                      summary: 'summary' }[m.role] || 'tool';
        // 진행 중 턴의 내 user/bot 메시지는 WS로 이미 표시 중일 수 있음 —
        // 마지막 청크만 추가하므로 중복 가능성 낮음. user는 스킵(이미 로컬 추가됨)
        if (m.role === 'user' && agentBusy) continue;
        agentAddMsg(cls, m.text);
      }
      histLen = msgs.length;
      agentLog.scrollTop = agentLog.scrollHeight;
    }
  } catch {}
}

function renderAgentStatus() {
  const running = agentBusy || serverBusy;
  agentStatus.textContent = running ? '진행 중…' : '대기';
  agentStatus.style.color = running ? '#7ee2a8' : '';
  agentSend.disabled = running;
  document.getElementById('agent-stop-btn').hidden = !running;
}

function agentSetBusy(busy) {
  agentBusy = busy;

}

/* ---- 경량 마크다운 렌더러 (외부 CDN 없이) ---- */
// Quotes too: mdInline puts link URLs inside href="…", and bot text is LLM output
// derived from on-screen game text, so an unescaped " would let it add attributes.
function mdEscape(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function mdInline(s) {
  s = s.replace(/`([^`]+)`/g, (_, c) => `<code>${c}</code>`);
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g, '$1<em>$2</em>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function agentMarkdown(src) {
  const lines = mdEscape(src).split('\n');
  const out = [];
  let inUl = false, inOl = false, inCode = false, codeBuf = [], para = [];
  const flushPara = () => { if (para.length) { out.push(`<p>${mdInline(para.join(' '))}</p>`); para = []; } };
  const closeLists = () => { if (inUl) { out.push('</ul>'); inUl = false; } if (inOl) { out.push('</ol>'); inOl = false; } };
  for (const line of lines) {
    if (line.trim().startsWith('```')) {
      if (inCode) { out.push(`<pre><code>${codeBuf.join('\n')}</code></pre>`); codeBuf = []; inCode = false; }
      else { flushPara(); closeLists(); inCode = true; }
      continue;
    }
    if (inCode) { codeBuf.push(line); continue; }
    const h = line.match(/^(#{1,3})\s+(.*)/);
    const li = line.match(/^\s*[-*]\s+(.*)/);
    const oli = line.match(/^\s*\d+[.)]\s+(.*)/);
    if (h) { flushPara(); closeLists(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); }
    else if (li) { flushPara(); if (inOl) { out.push('</ol>'); inOl = false; } if (!inUl) { out.push('<ul>'); inUl = true; } out.push(`<li>${mdInline(li[1])}</li>`); }
    else if (oli) { flushPara(); if (inUl) { out.push('</ul>'); inUl = false; } if (!inOl) { out.push('<ol>'); inOl = true; } out.push(`<li>${mdInline(oli[1])}</li>`); }
    else if (line.trim() === '') { flushPara(); closeLists(); }
    else para.push(line);
  }
  if (inCode) out.push(`<pre><code>${codeBuf.join('\n')}</code></pre>`);
  flushPara(); closeLists();
  return out.join('');
}

function agentAddMsg(cls, text) {
  const el = document.createElement('div');
  el.className = 'agent-msg ' + cls;
  el.dataset.raw = text;
  if (cls === 'bot') el.innerHTML = agentMarkdown(text);
  else if (cls === 'summary') {
    // "[세션 요약] <마크다운 본문>" — 라벨을 빼고 본문만 마크다운 렌더링
    const m = text.match(/^\[세션 요약\]\s*([\s\S]*)$/);
    const body = m ? m[1] : text;
    const label = document.createElement('div');
    label.className = 'sum-label';
    label.textContent = '📋 세션 요약 (이전 맥락 압축)';
    el.append(label);
    const bodyEl = document.createElement('div');
    bodyEl.className = 'sum-body';
    bodyEl.innerHTML = agentMarkdown(body);
    el.append(bodyEl);
  }
  else if (cls === 'tool') {
    // "⚙ {원문도구명} {설명}" → 한국어 명칭으로 치환 표시
    const m = text.match(/^⚙\s+(\S+)(.*)$/s);
    if (m) {
      const el2 = document.createElement('b');
      el2.textContent = `⚙ ${TOOL_KO[m[1]] || m[1]}`;
      el.append(el2);
      el.append(document.createTextNode(m[2] || ''));
    } else el.textContent = text;
  }
  else el.textContent = text;
  agentLog.appendChild(el);
  agentLog.scrollTop = agentLog.scrollHeight;
  return el;
}

function agentConnect() {
  if (agentWs && agentWs.readyState <= 1) return agentWs;
  const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  agentWs = new WebSocket(`${proto}//${window.location.host}/ws/agent/chat`);
  agentWs.onmessage = (ev) => {
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    if (m.type === 'tool') {
      agentAddMsg('tool', `⚙ ${m.name} ${m.desc || ''}`.trim());
      if (m.name === 'stopped') agentSetBusy(false);
    }
    else if (m.type === 'reply') { agentAddMsg('bot', m.text); agentSetBusy(false); }
    else if (m.type === 'error') { agentAddMsg('err', m.text); agentSetBusy(false); }
  };
  agentWs.onclose = () => { if (agentBusy) agentSetBusy(false); agentWs = null; };
  return agentWs;
}

function agentSendText() {
  const text = agentInput.value.trim();
  if (!text) return;
  if (agentBusy || serverBusy) {
    agentAddMsg('err', '에이전트가 진행 중이라 입력이 전송되지 않았습니다. '
      + '잠시 후 다시 시도하거나 ■ 버튼으로 중단해 주세요. (입력: '
      + text.slice(0, 80) + (text.length > 80 ? '…' : '') + ')');
    return;
  }
  const ws = agentConnect();
  if (ws.readyState === 0) { ws.addEventListener('open', () => { /* queued */ }); }
  agentAddMsg('user', text);
  agentInput.value = '';
  agentSetBusy(true);
  const push = () => ws.send(JSON.stringify({ type: 'user', text }));
  if (ws.readyState === 1) push();
  else ws.addEventListener('open', push, { once: true });
}

async function agentOpenSkillview() {

      svBody.innerHTML = `<div class="si-meta">이 앱의 진행 방법이 아직 없습니다${data.package ? ` (${mdEscape(data.label || data.package)})` : ''}</div>`;

    hdr.style.marginBottom = '4px';
    hdr.textContent = `${data.label || data.package || '감지 안 됨'} — ${data.skills.length}개`;
    wrap.appendChild(hdr);
    for (const s of data.skills) {
      const item = document.createElement('div');
      item.className = 'sv-item';
      item.innerHTML = `<div class="si-name"></div><div class="si-meta"></div>`;
      item.querySelector('.si-name').textContent = s.filename;
      item.querySelector('.si-meta').textContent = `${s.package} · ${s.created}`;
      item.addEventListener('click', async () => {
        svTitle.textContent = s.filename;
        svBody.textContent = '불러오는 중…';
        const r2 = await fetch('/agent/skill/' + encodeURIComponent(s.filename));
        const d2 = await r2.json();
        const body = d2.content || d2.error || '(내용 없음)';
        svBody.innerHTML = agentMarkdown(body.replace(/^---[\s\S]*?---\s*/, ''));
      });
      wrap.appendChild(item);
    }
    svBody.innerHTML = '';
    svBody.appendChild(wrap);
    agentLoadAppbar();
  } catch (e) {
    svBody.textContent = '게임북을 불러오지 못했습니다: ' + e;
  }
}
bookBtn.addEventListener('click', agentOpenSkillview);
document.getElementById('sv-close').addEventListener('click', () => {
  skillView.classList.remove('open');
});
</script>
</body>
</html>
