<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>scrcpy Remote</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg-0: #080b14;
  --bg-1: #0f1526;
  --bg-2: #151e33;
  --card: rgba(17, 25, 44, 0.92);
  --line: rgba(120, 148, 215, 0.25);
  --text: #ecf0ff;
  --text-dim: #9aa8cc;
  --accent: #7b8cff;
  --accent-2: #36d5ff;
  --grid-dot: rgba(120, 148, 215, 0.22);
}
html, body { height: 100%; }
body {
  font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  color: var(--text);
  overflow: hidden;
}

/* ---- n8n-style dotted grid canvas ---- */
#canvas {
  position: fixed;
  inset: 0;
  background-color: var(--bg-0);
  background-image:
    radial-gradient(900px 500px at 0% 0%, rgba(54, 213, 255, 0.10), transparent 55%),
    radial-gradient(900px 500px at 100% 100%, rgba(123, 140, 255, 0.10), transparent 55%),
    radial-gradient(circle, var(--grid-dot) 1.4px, transparent 1.6px);
  background-size: auto, auto, 22px 22px;
  overflow: hidden;
  touch-action: none;
}

/* ---- Empty state (no devices connected) ---- */
#empty-state {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  gap: 8px; text-align: center; pointer-events: none; user-select: none;
}
#empty-state .es-title { font-size: 17px; font-weight: 700; color: var(--text-dim); letter-spacing: 0.02em; }
#empty-state .es-sub { font-size: 12px; color: rgba(154, 168, 204, 0.6); }

/* ---- Floating phone card ---- */
.phone-card {
  position: absolute;
  display: flex;
  flex-direction: column;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 18px 55px rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(10px);
  user-select: none;
}
.phone-card.active { border-color: rgba(54, 213, 255, 0.7); box-shadow: 0 18px 55px rgba(0,0,0,0.55), 0 0 0 2px rgba(54,213,255,0.35); }

.card-header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 7px 10px;
  cursor: move;
  border-bottom: 1px solid var(--line);
  background: linear-gradient(135deg, rgba(22, 30, 54, 0.95), rgba(18, 27, 49, 0.95));
  border-radius: 14px 14px 0 0;
  touch-action: none;
}
.grip { flex-shrink: 0; color: var(--text-dim); letter-spacing: 2px; font-size: 12px; line-height: 1; }
.card-label { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--text); }
.card-status {
  flex: 1; font-size: 11px; color: var(--text-dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  text-align: right; letter-spacing: 0.02em;
}

.video-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 9 / 19;
  background: radial-gradient(circle at 50% 10%, #0f1628 10%, #02040a 80%);
  overflow: hidden;
}
.remote-video { width: 100%; height: 100%; object-fit: contain; display: block; }
.remote-video.rotated { position: absolute; top: 50%; left: 50%; width: auto; height: auto; object-fit: contain; }
.touch-overlay { position: absolute; inset: 0; cursor: default; touch-action: none; }
.video-loading {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(0, 0, 0, 0.6); color: var(--text-dim); font-size: 13px;
  z-index: 10; pointer-events: none;
}
.video-loading .spinner {
  width: 40px; height: 40px;
  border: 3px solid rgba(123, 140, 255, 0.2);
  border-top: 3px solid var(--accent-2);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.btn-bar {
  display: flex; gap: 6px; padding: 9px;
  background: linear-gradient(180deg, rgba(20, 29, 51, 0.95), rgba(14, 21, 38, 0.95));
  border-top: 1px solid var(--line);
  border-radius: 0 0 14px 14px;
  flex-wrap: wrap; justify-content: center;
}
.btn-bar button {
  padding: 7px 11px; font-size: 12px;
  background: linear-gradient(180deg, rgba(123, 140, 255, 0.22), rgba(90, 105, 214, 0.18));
  color: var(--text); border: 1px solid rgba(123, 140, 255, 0.35);
  border-radius: 10px; cursor: pointer; font-weight: 600;
  transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
}
.btn-bar button:hover { border-color: rgba(123, 140, 255, 0.65); box-shadow: 0 0 0 2px rgba(123, 140, 255, 0.18); transform: translateY(-1px); }
.btn-bar button:active { transform: translateY(0); }
.btn-bar button.kb-on { background: var(--accent); color: #fff; }

/* ---- Resize handle (bottom-right corner) ---- */
.resize-handle {
  position: absolute; right: -3px; bottom: -3px;
  width: 20px; height: 20px; cursor: nwse-resize; z-index: 20; touch-action: none;
}
.resize-handle::after {
  content: ''; position: absolute; right: 4px; bottom: 4px;
  width: 11px; height: 11px;
  border-right: 2px solid var(--accent-2); border-bottom: 2px solid var(--accent-2);
  border-radius: 0 0 4px 0; opacity: 0.85;
}

::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: linear-gradient(180deg, rgba(123, 140, 255, 0.65), rgba(54, 213, 255, 0.55)); border-radius: 999px; }
</style>
</head>
<body>

<div id="canvas">
  <div id="empty-state">
    <div class="es-title">연결된 기기가 없습니다</div>
    <div class="es-sub">기기를 연결하면 화면이 자동으로 나타납니다</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/jmuxer@2.1.0/dist/jmuxer.min.js"></script>
<script>
/* =================================================================
   scrcpy Web Remote — multi-device dashboard
   Each device = one floating PhoneCard. Video/control go to the C
   backend via Apache (/ws/* -> 18080, /ws2/* -> 18081).
   ================================================================= */

const wsProto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
function wsUrl(path) { return `${wsProto}//${window.location.host}${path}`; }

// One entry per device. Add more here + a matching scrcpy-webN service & Apache route.
const DEVICES = [
  { label: 'Z-Flip4', video: '/ws/video',  control: '/ws/control'  },
  { label: 'Redroid-Work', video: '/ws2/video', control: '/ws2/control' },
  { label: 'Redroid-Game', video: '/ws3/video', control: '/ws3/control' },
];

const isFirefoxBrowser = /Firefox\//.test(navigator.userAgent) || typeof InstallTrigger !== 'undefined';
const isChromiumBrowser = !isFirefoxBrowser
  && (/(Chrome|Chromium|Edg)\//.test(navigator.userAgent) || (!!window.chrome && !!window.chrome.runtime));

const KEY_TO_ANDROID = {
  'KeyA':29,'KeyB':30,'KeyC':31,'KeyD':32,'KeyE':33,'KeyF':34,'KeyG':35,
  'KeyH':36,'KeyI':37,'KeyJ':38,'KeyK':39,'KeyL':40,'KeyM':41,'KeyN':42,
  'KeyO':43,'KeyP':44,'KeyQ':45,'KeyR':46,'KeyS':47,'KeyT':48,'KeyU':49,
  'KeyV':50,'KeyW':51,'KeyX':52,'KeyY':53,'KeyZ':54,
  'Digit0':7,'Digit1':8,'Digit2':9,'Digit3':10,'Digit4':11,
  'Digit5':12,'Digit6':13,'Digit7':14,'Digit8':15,'Digit9':16,
  'Enter':66,'Backspace':67,'Delete':112,'Tab':61,'Space':62,'Escape':111,
  'ArrowUp':19,'ArrowDown':20,'ArrowLeft':21,'ArrowRight':22,
  'ShiftLeft':59,'ShiftRight':60,'ControlLeft':113,'ControlRight':114,
  'AltLeft':57,'AltRight':58,'MetaLeft':117,'MetaRight':118,
  'Comma':55,'Period':56,'Slash':76,'Semicolon':74,'Quote':75,
  'BracketLeft':71,'BracketRight':72,'Backslash':73,'Minus':69,'Equal':70,
  'Backquote':68,'CapsLock':115,
  'F1':131,'F2':132,'F3':133,'F4':134,'F5':135,'F6':136,
  'F7':137,'F8':138,'F9':139,'F10':140,'F11':141,'F12':142,
  'Home':122,'End':123,'PageUp':92,'PageDown':93,'Insert':124,
  'Numpad0':144,'Numpad1':145,'Numpad2':146,'Numpad3':147,'Numpad4':148,
  'Numpad5':149,'Numpad6':150,'Numpad7':151,'Numpad8':152,'Numpad9':153,
  'NumpadEnter':160,'NumpadAdd':157,'NumpadSubtract':156,
  'NumpadMultiply':155,'NumpadDivide':154,'NumpadDecimal':158,
};

const MIN_W = 160;
const GRACE_MS = 10000;   // keep a card visible ("reconnecting…") this long before hiding on a drop
const canvas = document.getElementById('canvas');
const emptyEl = document.getElementById('empty-state');
const cards = [];
let ztop = 10;

// Show the "no devices" hint only when no card is currently online.
function updateEmptyState() {
  emptyEl.style.display = cards.some(c => c.online) ? 'none' : 'flex';
}
let keyboardCard = null;   // card currently receiving physical keyboard input
let activeCard = null;     // last-focused card (visual highlight)

function maxCardWidth() { return Math.max(MIN_W, window.innerWidth - 24); }
function el(tag, cls) { const e = document.createElement(tag); if (cls) e.className = cls; return e; }

function setActive(card) {
  if (activeCard === card) return;
  if (activeCard) activeCard.root.classList.remove('active');
  activeCard = card;
  if (card) card.root.classList.add('active');
}
function bringToFront(card) { card.root.style.zIndex = ++ztop; setActive(card); }

// Arrange all not-yet-user-moved cards in a centered horizontal row.
function layoutCards() {
  const auto = cards.filter(c => !c.userSized && c.root.offsetWidth > 0);
  if (!auto.length) return;
  const gap = 24;
  let total = auto.reduce((s, c) => s + c.root.offsetWidth, 0) + gap * (auto.length - 1);
  let x = Math.max(12, (window.innerWidth - total) / 2);
  for (const c of auto) {
    const top = Math.max(8, (window.innerHeight - c.root.offsetHeight) / 2);
    c.setPos(x, top);
    x += c.root.offsetWidth + gap;
  }
}

/* ----------------------------------------------------------------
   PhoneCard: one device — DOM + websockets + video + input
   ---------------------------------------------------------------- */
function PhoneCard(device) {
  const self = {
    device,
    videoWs: null, controlWs: null, jmuxer: null,
    deviceWidth: 0, deviceHeight: 0, deviceCodec: null,
    videoStarted: false, rot: 0, manualLock: false,
    userSized: false, kbActive: false, jmuxerRetry: 0,
    online: false,   // true only while a live stream is flowing (card visible)
    hideTimer: null, // pending "hide after grace period" timer during a drop
  };

  // --- DOM ---
  const root = el('div', 'phone-card');
  const header = el('div', 'card-header');
  const grip = el('span', 'grip'); grip.textContent = '⠿';
  const label = el('span', 'card-label'); label.textContent = device.label;
  const status = el('span', 'card-status'); status.textContent = 'Not connected';
  header.append(grip, label, status);

  const wrapper = el('div', 'video-wrapper');
  const video = el('video', 'remote-video');
  video.autoplay = true; video.muted = true; video.playsInline = true;
  video.setAttribute('playsinline', '');
  const overlay = el('canvas', 'touch-overlay');
  const loading = el('div', 'video-loading');
  const spin = el('div', 'spinner'); const ltext = el('div'); ltext.textContent = 'Loading video stream...';
  loading.append(spin, ltext);
  wrapper.append(video, overlay, loading);

  const bar = el('div', 'btn-bar');
  function mkBtn(text, fn, title) { const b = el('button'); b.textContent = text; if (title) b.title = title; b.addEventListener('click', fn); return b; }
  bar.append(
    mkBtn('Back', () => self.sendKey('back')),
    mkBtn('Home', () => self.sendKey('home')),
    mkBtn('Recents', () => self.sendKey('app_switch')),
    mkBtn('Rotate', (e) => self.toggleRotation(e), 'Click: rotate 90°, Shift+Click: auto'),
    mkBtn('Vol+', () => self.sendKey('volume_up')),
    mkBtn('Vol-', () => self.sendKey('volume_down')),
    mkBtn('Power', () => self.sendKey('power')),
  );
  const kbBtn = mkBtn('KB: OFF', () => self.toggleKeyboard(), 'Toggle keyboard input to this device');
  bar.append(kbBtn);

  const handle = el('div', 'resize-handle'); handle.title = 'Drag to resize';
  root.append(header, wrapper, bar, handle);
  root.style.display = 'none';   // hidden until a live stream arrives
  canvas.appendChild(root);

  self.root = root; self.video = video; self.wrapper = wrapper; self.overlay = overlay;
  self.loading = loading; self.status = status; self.kbBtn = kbBtn;

  const setStatus = (m) => { status.textContent = m; };
  // Overlay shown over the video: spinning "loading" while connecting,
  // or a static "disconnected" notice while the device/backend is unreachable.
  function setOverlay(msg, spinning) {
    ltext.textContent = msg;
    spin.style.display = spinning ? '' : 'none';
    loading.style.display = 'flex';
  }

  /* ---- sizing / aspect ---- */
  function visualAspectRatio() {
    let vw = video.videoWidth, vh = video.videoHeight;
    if (!vw || !vh) { vw = self.deviceWidth; vh = self.deviceHeight; }
    if (!vw || !vh) return null;
    return (self.rot !== 0) ? (vh / vw) : (vw / vh);  // -90° swaps visual w/h
  }
  function applyAspect() {
    const ar = visualAspectRatio();
    if (ar) wrapper.style.aspectRatio = String(ar);
  }
  function resizeOverlay() { overlay.width = wrapper.clientWidth; overlay.height = wrapper.clientHeight; }

  self.setWidth = function (w) {
    const clamped = Math.max(MIN_W, Math.min(w, maxCardWidth()));
    root.style.width = clamped + 'px';
    requestAnimationFrame(() => { resizeOverlay(); if (self.rot !== 0) applyVideoLayout(); });
  };
  self.setPos = function (left, top) {
    const w = root.offsetWidth;
    left = Math.max(-(w - 90), Math.min(left, window.innerWidth - 90));
    top = Math.max(0, Math.min(top, window.innerHeight - 38));
    root.style.left = left + 'px';
    root.style.top = top + 'px';
  };
  self.fitToViewport = function () {
    const ar = visualAspectRatio();
    if (!ar) return;
    const headerH = header.offsetHeight || 36;
    const barH = bar.offsetHeight || 56;
    const budgetH = window.innerHeight * 0.9 - headerH - barH;
    let width = budgetH * ar;
    width = Math.min(width, window.innerWidth * 0.46, maxCardWidth());
    width = Math.max(MIN_W, width);
    self.setWidth(width);
  };

  function applyVideoLayout() {
    if (self.rot === 0) {
      video.classList.remove('rotated');
      video.style.transform = ''; video.style.width = ''; video.style.height = '';
      return;
    }
    const wW = wrapper.clientWidth, wH = wrapper.clientHeight;
    video.classList.add('rotated');
    video.style.width = wH + 'px';
    video.style.height = wW + 'px';
    video.style.transform = 'translate(-50%, -50%) rotate(-90deg)';
  }

  function updateOrientation() {
    if (!self.manualLock) {
      if (!isChromiumBrowser) {
        self.rot = 0;
      } else {
        const vw = video.videoWidth, vh = video.videoHeight;
        if (vw && vh && self.deviceWidth && self.deviceHeight) {
          const needs = (self.deviceHeight > self.deviceWidth) !== (vh > vw);
          self.rot = needs ? -90 : 0;
        }
      }
    }
    applyAspect(); applyVideoLayout(); resizeOverlay();
  }

  self.toggleRotation = function (e) {
    if (e && e.shiftKey) { self.manualLock = false; updateOrientation(); return; }
    self.manualLock = true;
    self.rot = self.rot === 0 ? -90 : 0;
    applyAspect(); applyVideoLayout(); resizeOverlay();
  };

  /* ---- input ---- */
  self.sendKey = function (key) {
    if (self.controlWs && self.controlWs.readyState === WebSocket.OPEN)
      self.controlWs.send(JSON.stringify({ type: 'key', key }));
  };
  self.sendTouch = function (action, clientX, clientY) {
    if (!self.controlWs || self.controlWs.readyState !== WebSocket.OPEN) { setStatus('Touch: WS not open'); return; }
    const vw = (self.rot !== 0) ? self.deviceWidth : (video.videoWidth || self.deviceWidth);
    const vh = (self.rot !== 0) ? self.deviceHeight : (video.videoHeight || self.deviceHeight);
    if (!vw || !vh) { setStatus('Touch: no dimensions'); return; }
    const r = video.getBoundingClientRect();
    const nx = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
    const ny = Math.max(0, Math.min(1, (clientY - r.top) / r.height));
    const x = Math.min(Math.round(nx * vw), vw - 1);
    const y = Math.min(Math.round(ny * vh), vh - 1);
    self.controlWs.send(JSON.stringify({ type: 'touch', action, x, y, w: vw, h: vh }));
    setStatus(action + ' ' + x + ',' + y + ' (' + vw + 'x' + vh + ')');
  };
  self.handleKey = function (e) {
    if (!self.kbActive) return;
    const tag = (e.target || e.srcElement).tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;
    if (!self.controlWs || self.controlWs.readyState !== WebSocket.OPEN) return;
    const code = KEY_TO_ANDROID[e.code];
    if (code !== undefined) {
      e.preventDefault();
      let m = 0;
      if (e.shiftKey) m |= 1; if (e.ctrlKey) m |= 0x1000; if (e.altKey) m |= 2; if (e.metaKey) m |= 0x10000;
      self.controlWs.send(JSON.stringify({ type: 'keyevent', action: e.type === 'keydown' ? 'down' : 'up', keycode: code, metastate: m }));
      return;
    }
    if (e.type === 'keydown' && e.key.length === 1 && !e.ctrlKey && !e.altKey && !e.metaKey) {
      e.preventDefault();
      self.controlWs.send(JSON.stringify({ type: 'text', text: e.key }));
    }
  };
  self.toggleKeyboard = function () {
    self.kbActive = !self.kbActive;
    if (self.kbActive) {
      // exclusive: turn others off
      for (const c of cards) if (c !== self && c.kbActive) { c.kbActive = false; c.kbBtn.textContent = 'KB: OFF'; c.kbBtn.classList.remove('kb-on'); }
      keyboardCard = self;
    } else if (keyboardCard === self) {
      keyboardCard = null;
    }
    kbBtn.textContent = self.kbActive ? 'KB: ON' : 'KB: OFF';
    kbBtn.classList.toggle('kb-on', self.kbActive);
  };

  /* ---- websockets ---- */
  function initVideoWs() {
    self.videoWs = new WebSocket(wsUrl(device.video));
    self.videoWs.binaryType = 'arraybuffer';
    self.videoWs.onopen = () => { setStatus('Connected'); self.videoStarted = false; setOverlay('Loading video stream…', true); };
    self.videoWs.onmessage = (evt) => {
      if (typeof evt.data === 'string') {
        try {
          const info = JSON.parse(evt.data);
          self.deviceWidth = info.width || 0;
          self.deviceHeight = info.height || 0;
          const codec = info.codec || 'h264';
          setStatus(self.deviceWidth + 'x' + self.deviceHeight + ' [' + codec.toUpperCase() + ']');
          if (self.hideTimer) { clearTimeout(self.hideTimer); self.hideTimer = null; }  // reconnected in time
          if (!self.online) {                 // device came online → reveal card
            self.online = true;
            root.style.display = '';
            updateEmptyState();
            if (!self.userSized) self.fitToViewport();
            layoutCards();
          }
          applyAspect(); resizeOverlay();
          if (!self.jmuxer || codec !== self.deviceCodec) { self.deviceCodec = codec; initJmuxer(codec); }
        } catch (e) { /* ignore */ }
        return;
      }
      if (!self.jmuxer) return;
      try { self.jmuxer.feed({ video: patchSpsLevel(new Uint8Array(evt.data)) }); } catch (e) { console.error('jmuxer feed', e); }
      if (video.paused) video.play().catch(() => {});
      if (video.buffered.length > 0) {
        markVideoStarted();   // first decodable data → drop the "Loading…" overlay even on a static screen
        const end = video.buffered.end(video.buffered.length - 1);
        const lag = end - video.currentTime;
        // Keep latency low WITHOUT mid-GOP seeks: seeking to a non-keyframe position
        // corrupts the H264 decode (macroblock garbage) until the next keyframe. Instead
        // nudge playbackRate to absorb drift/jitter smoothly; only hard-seek if we're
        // hopelessly behind (e.g. after a long stall), where a brief resync is acceptable.
        if (lag > 4) { video.currentTime = end - 0.3; video.playbackRate = 1.0; }
        else if (lag > 0.35) { video.playbackRate = 1.12; }
        else if (lag < 0.12) { video.playbackRate = 1.0; }
      }
    };
    self.videoWs.onclose = () => {
      self.videoStarted = false;
      if (self.online) {
        // Brief drop: keep the card up showing "reconnecting…" and only hide it
        // if the stream stays down past GRACE_MS (avoids flicker on a flaky link).
        setOverlay('🔌 ' + device.label + ' 재연결 중…', true);
        if (!self.hideTimer) {
          self.hideTimer = setTimeout(() => {
            self.hideTimer = null;
            self.online = false;
            root.style.display = 'none';
            updateEmptyState();
            layoutCards();
          }, GRACE_MS);
        }
      } else {
        setOverlay('Loading video stream…', true);  // reset for next connect
      }
      setTimeout(initVideoWs, 3000);     // keep probing; card reappears when it streams again
    };
    self.videoWs.onerror = () => { self.videoWs.close(); };
  }
  function initControlWs() {
    self.controlWs = new WebSocket(wsUrl(device.control));
    self.controlWs.onclose = () => { setTimeout(initControlWs, 3000); };
    self.controlWs.onerror = () => { self.controlWs.close(); };
  }
  // Some device encoders (e.g. LG Velvet) write a bogus SPS level_idc (Level 1.0)
  // for a large frame; strict browser H264 decoders then under-allocate their
  // buffers and render macroblock garbage (ffmpeg is tolerant, so the bitstream is
  // otherwise fine). Bump level_idc in every SPS NAL to 4.1 so the browser sizes
  // its decode buffers correctly. Only raises the level, never lowers a good one.
  function patchSpsLevel(b) {
    const n = b.length;
    for (let i = 0; i + 4 < n; i++) {
      let hdr = -1;
      if (b[i] === 0 && b[i + 1] === 0 && b[i + 2] === 1) hdr = i + 3;
      else if (b[i] === 0 && b[i + 1] === 0 && b[i + 2] === 0 && b[i + 3] === 1) hdr = i + 4;
      if (hdr < 0 || hdr + 3 >= n) continue;
      if ((b[hdr] & 0x1f) === 7 && b[hdr + 3] < 0x29) b[hdr + 3] = 0x29;  // SPS → level_idc = 4.1
    }
    return b;
  }

  function initJmuxer(codec) {
    if (typeof JMuxer === 'undefined') { setStatus('Error: jmuxer not loaded'); return; }
    if (typeof MediaSource === 'undefined') { setStatus('Error: no MediaSource'); return; }
    let mseCodec, jVideoCodec;
    if (codec === 'h265') { mseCodec = 'video/mp4; codecs="hev1.1.6.L93.B0"'; jVideoCodec = 'H265'; }
    else { mseCodec = 'video/mp4; codecs="avc1.640028"'; jVideoCodec = undefined; }
    if (!MediaSource.isTypeSupported(mseCodec)) { setStatus('Error: ' + codec.toUpperCase() + ' unsupported'); return; }
    if (self.jmuxer) { try { self.jmuxer.destroy(); } catch (e) {} self.jmuxer = null; }
    try {
      const opts = {
        node: video, mode: 'video', flushingTime: 100, fps: 30, debug: false,
        onReady: () => { setStatus('Ready [' + codec.toUpperCase() + ']'); self.jmuxerRetry = 0; },
        onError: (err) => {
          const name = err && (err.name || ''); const msg = err && (err.error || err.message || '');
          setStatus('Video error');
          if (name === 'InvalidStateError' || msg === 'buffer error') {
            self.jmuxerRetry++;
            if (self.jmuxerRetry <= 3) { setStatus('Reinitializing...'); setTimeout(() => initJmuxer(self.deviceCodec || 'h264'), 1000); }
            else { self.jmuxerRetry = 0; setStatus('Reconnecting...'); if (self.videoWs) self.videoWs.close(); }
          }
        },
      };
      if (jVideoCodec) opts.videoCodec = jVideoCodec;
      self.jmuxer = new JMuxer(opts);
    } catch (e) { setStatus('jmuxer init error'); }
  }

  /* ---- drag (header) ---- */
  (function () {
    let dragging = false, offX = 0, offY = 0;
    header.addEventListener('pointerdown', (e) => {
      dragging = true; self.userSized = true; bringToFront(self);
      const r = root.getBoundingClientRect(); offX = e.clientX - r.left; offY = e.clientY - r.top;
      header.setPointerCapture(e.pointerId); e.preventDefault();
    });
    header.addEventListener('pointermove', (e) => { if (dragging) self.setPos(e.clientX - offX, e.clientY - offY); });
    const end = (e) => { if (!dragging) return; dragging = false; try { header.releasePointerCapture(e.pointerId); } catch (_) {} };
    header.addEventListener('pointerup', end);
    header.addEventListener('pointercancel', end);
  })();

  /* ---- resize (corner) ---- */
  (function () {
    let resizing = false, startX = 0, startW = 0;
    handle.addEventListener('pointerdown', (e) => {
      resizing = true; self.userSized = true; bringToFront(self);
      startX = e.clientX; startW = root.offsetWidth;
      handle.setPointerCapture(e.pointerId); e.preventDefault(); e.stopPropagation();
    });
    handle.addEventListener('pointermove', (e) => { if (resizing) self.setWidth(startW + (e.clientX - startX)); });
    const end = (e) => { if (!resizing) return; resizing = false; try { handle.releasePointerCapture(e.pointerId); } catch (_) {} };
    handle.addEventListener('pointerup', end);
    handle.addEventListener('pointercancel', end);
  })();

  /* ---- touch overlay ---- */
  (function () {
    let isDown = false;
    overlay.addEventListener('contextmenu', (e) => e.preventDefault());
    overlay.addEventListener('mousedown', (e) => {
      e.preventDefault(); bringToFront(self);
      if (e.button === 2) { self.sendKey('back'); return; }
      isDown = true; self.sendTouch('down', e.clientX, e.clientY);
    });
    overlay.addEventListener('mousemove', (e) => { if (!isDown) return; e.preventDefault(); self.sendTouch('move', e.clientX, e.clientY); });
    overlay.addEventListener('mouseup', (e) => { if (!isDown) return; isDown = false; e.preventDefault(); self.sendTouch('up', e.clientX, e.clientY); });
    overlay.addEventListener('mouseleave', (e) => { if (!isDown) return; isDown = false; self.sendTouch('up', e.clientX, e.clientY); });
    overlay.addEventListener('touchstart', (e) => { e.preventDefault(); bringToFront(self); const t = e.touches[0]; isDown = true; self.sendTouch('down', t.clientX, t.clientY); });
    overlay.addEventListener('touchmove', (e) => { e.preventDefault(); const t = e.touches[0]; self.sendTouch('move', t.clientX, t.clientY); });
    overlay.addEventListener('touchend', (e) => { e.preventDefault(); isDown = false; const t = e.changedTouches[0]; self.sendTouch('up', t.clientX, t.clientY); });
    overlay.addEventListener('touchcancel', (e) => { e.preventDefault(); isDown = false; const t = e.changedTouches[0]; self.sendTouch('up', t.clientX, t.clientY); });
  })();

  /* ---- boot ---- */
  // Hide the "Loading…" overlay as soon as the first frame is renderable.
  // A static/dozing screen sends only one cached keyframe (no timeupdate ticks),
  // so trigger on loadeddata/canplay and the first buffered data too — otherwise the
  // card stays stuck on "Loading…" until the user nudges the device (e.g. Home).
  function markVideoStarted() {
    if (self.videoStarted) return;
    self.videoStarted = true;
    loading.style.display = 'none';
    updateOrientation();
    if (!self.userSized) { self.fitToViewport(); layoutCards(); }
  }
  video.addEventListener('timeupdate', () => { if (video.currentTime > 0) markVideoStarted(); });
  video.addEventListener('loadeddata', markVideoStarted);
  video.addEventListener('canplay', markVideoStarted);
  video.addEventListener('resize', () => {
    updateOrientation();
    if (!self.userSized) { self.fitToViewport(); layoutCards(); }
  });

  // initial width before first frame
  self.setWidth(Math.min(320, Math.round(window.innerWidth * 0.42), maxCardWidth()));
  initVideoWs();
  initControlWs();
  resizeOverlay();
  return self;
}

/* ---- global wiring ---- */
DEVICES.forEach((d) => cards.push(PhoneCard(d)));
updateEmptyState();   // all cards start hidden until they stream
requestAnimationFrame(layoutCards);

document.addEventListener('keydown', (e) => { if (keyboardCard) keyboardCard.handleKey(e); });
document.addEventListener('keyup', (e) => { if (keyboardCard) keyboardCard.handleKey(e); });

window.addEventListener('resize', () => {
  for (const c of cards) { c.overlay.width = c.wrapper.clientWidth; c.overlay.height = c.wrapper.clientHeight; }
  layoutCards();
});
</script>
</body>
</html>
